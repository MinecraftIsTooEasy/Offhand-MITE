plugins {
    id 'fml-loom' version '0.1'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

def useLocalizedArchiveName = Locale.default.country.equalsIgnoreCase("CN")
def clientMinHeap = providers.gradleProperty("client_min_heap").getOrElse("256M")   // Spark set
def clientMaxHeap = providers.gradleProperty("client_max_heap").getOrElse("2G")     // Spark set

base {
    // Prefix local JAR names with an optional alias, for example: "[Alias]" + archives_base_name.
    // Maven publishing keeps using the lowercase maven_id configured below.
    archivesName = useLocalizedArchiveName
            ? "[副手]${project.archives_base_name}"
            : project.archives_base_name
}

repositories {
    maven {
        name = "Spongepowered"
        url = "https://repo.spongepowered.org/repository/maven-public/"
    }
    maven {
        name = "ModdedMITE"
        url = "https://maven.limingzxc.top/repository/maven-public/"
    }
}

configurations {
    fml
}

dependencies {
    // Dependency versions are maintained in gradle.properties or alongside project-specific declarations below.
    // Use implementation for required mods, compileOnly for optional integrations,
    // and localRuntime for mods needed only in the development environment.

    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation("it.unimi.dsi:fastutil:8.5.12")
    implementation("com.google.code.gson:gson:2.11.0")

    fml "com.github.MinecraftIsTooEasy:FishModLoader:3.4.3"
    implementation "com.github.MinecraftIsTooEasy:FishModLoader:3.4.3"
    implementation "com.github.MinecraftIsTooEasy:RustedIronCore:1.5.7"
    implementation "com.github.MinecraftIsTooEasy:ManyLib:2.3.1"

    // other Mod
    localRuntime "com.github.MinecraftIsTooEasy:ModernMITE:3.7.4"
    localRuntime "com.github.MinecraftIsTooEasy:Waila:2.0.6"
    localRuntime "com.github.MinecraftIsTooEasy:BetterGameSetting:1.4.0.1"
    localRuntime "com.github.MinecraftIsTooEasy:OhMyCommands:3.0.0-mc1.6.4-MITE-20260629"
    localRuntime "com.github.MinecraftIsTooEasy:BetterTips:1.5.1"
    localRuntime files('libs/SelectionBox-1.1.1.jar')
    localRuntime files('libs/spark-mite-1.10.0.jar')
//    localRuntime files('libs/MiTE-Renewed.0.2.8.1.jar')
//    localRuntime "com.github.MinecraftIsTooEasy:BreadSkin:1.6.0.jar"
//    localRuntime "com.github.MinecraftIsTooEasy:BetterGrassAndLeaves:1.0.1"
//    localRuntime files('libs/26.2.jar')
}

def fmlResolvedFile = configurations.fml.singleFile

loom {
    accessWidenerPath = file("src/main/resources/offhand.accesswidener")
    mergedMinecraftJar()
    setFML(fmlResolvedFile)
    dependencies.add("mappings", fmlMCPMappings())
    mods {
        "offhand" {
            sourceSet sourceSets.main
        }
    }
    runs {
        client {
            String name = project.username
            String width = project.screen_width
            String height = project.screen_height
            vmArgs "-Xms${clientMinHeap}", "-Xmx${clientMaxHeap}"   // Spark set
            programArgs "--userProperties", "{}", "--username", name, "--session", "a.a.a.a", "--width", width, "--height", height
        }
    }
}

processResources {
    inputs.properties(
            version: project.version,
            id: project.mod_id,
            name: project.mod_name
    )

    filesMatching("fml.mod.json") {
        expand(inputs.properties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { String fileName -> "${fileName}_${inputs.properties.archivesName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.maven_id
            from(components.java)
        }
    }

    repositories {
        maven {
            name = "ModdedMITE"
            url = uri("https://maven.limingzxc.top/repository/maven-releases/")
            credentials {
                username = project.findProperty("nexusUsername")
                password = project.findProperty("nexusPassword")
            }
        }
    }
}
